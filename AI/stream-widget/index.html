<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kolpak build progress</title>
<style>
@font-face { font-family: "Oswald"; src: url("fonts/Oswald.ttf"); font-weight: 200 700; }
@font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }

:root {
  --black: #0B0B0C; --panel: #1A1A1C; --line: #3A3A3D; --paper: #EDEBE4;
  --ink: #111111; --muted: #9A9A9E; --orange: #FF4A1C;
  --h: 48px;               /* strip height; override with ?h=40 */
}
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; overflow: hidden; }

.bar {
  height: var(--h); width: 100%; display: flex; align-items: stretch;
  background: var(--black); color: var(--paper);
  font: 700 13px/1 "JetBrains Mono", monospace; white-space: nowrap;
}
.icon {
  flex: none; width: var(--h); display: grid; place-items: center;
}
.icon svg { width: 75%; height: 75%; background: var(--paper); border-radius: 20%; }
.name {
  flex: none; display: flex; align-items: center; padding: 0 14px 0 4px;
  font: 700 calc(var(--h) * .42)/1 "Oswald", Impact, sans-serif;
  letter-spacing: .06em; text-transform: uppercase;
}
.steps { flex: 1 1 auto; min-width: 0; display: flex; gap: 2px; padding: 6px 0; }
.step {
  flex: 1 1 0; min-width: 0; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--panel); color: var(--muted);
  font: 700 calc(var(--h) * .31)/1 "Oswald", Impact, sans-serif;
  letter-spacing: .08em; text-transform: uppercase;
}
.step i { font: 700 11px/1 "JetBrains Mono", monospace; font-style: normal; opacity: .8; }
.step.done { background: var(--paper); color: var(--ink); }
.step.now  { background: var(--black); color: var(--orange); box-shadow: inset 0 0 0 2px var(--orange); }
.step .fill { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--orange); }
.now-line {
  flex: 0 1 auto; min-width: 0; display: flex; align-items: center; padding: 0 14px;
  color: var(--paper); overflow: hidden;
}
.now-line span { overflow: hidden; text-overflow: ellipsis; }
.now-line b { color: var(--muted); font-weight: 400; margin-right: 8px; }
.cursor { color: var(--orange); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.pct {
  flex: none; display: flex; align-items: center; padding: 0 14px;
  background: var(--orange); color: var(--ink);
  font: 700 calc(var(--h) * .46)/1 "Oswald", Impact, sans-serif;
}
@media (max-width: 900px) { .now-line { display: none; } }
@media (max-width: 560px) { .name, .step i { display: none; } .step { font-size: 11px; letter-spacing: .02em; } }
@media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
</style>
</head>
<body>
<div class="bar" role="status" aria-label="Kolpak build progress">
  <div class="icon" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="6 0 188 188">
      <g transform="translate(6 4)" fill="#FF4A1C">
        <path d="M52 70C50 30 150 28 150 72V120C150 160 120 178 100 180 78 178 52 160 52 120Z"/>
        <path d="M82 168L78 222H126L120 168Z"/>
        <path d="M52 88C38 82 36 112 52 116ZM150 88C164 82 166 112 150 116Z"/>
      </g>
      <path d="M46 76C40 28 70 10 104 12 140 10 162 34 156 78 146 52 130 44 100 46 74 44 56 54 46 76Z" fill="#111111"/>
      <g fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M52 70V120C52 160 78 178 100 180 120 178 150 160 150 120V72"/>
        <path d="M82 172L78 222M120 172L126 222"/>
        <path d="M60 124C64 136 66 144 72 150M142 124C138 136 136 144 130 150M100 100L96 126 106 128M86 62H116"/>
      </g>
      <path d="M64 80L92 91M138 80L110 91" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
      <g fill="#F4F4F0" stroke="#111111" stroke-width="3.5">
        <ellipse cx="79" cy="102" rx="13" ry="10"/><ellipse cx="123" cy="102" rx="13" ry="10"/>
        <path d="M76 142C90 136 112 136 126 142L124 158C110 163 92 163 78 158Z"/>
      </g>
      <circle cx="80" cy="103" r="5" fill="#2B4BFF"/><circle cx="122" cy="103" r="5" fill="#2B4BFF"/>
      <circle cx="80" cy="103" r="2" fill="#111111"/><circle cx="122" cy="103" r="2" fill="#111111"/>
      <path d="M88 140V161M100 139V162M112 140V161M77 150H125" stroke="#111111" stroke-width="2.5" fill="none"/>
      <path d="M38 98C22 -10 180 -10 164 98" fill="none" stroke="#111111" stroke-width="12" stroke-linecap="round"/>
      <path d="M38 98C22 -10 180 -10 164 98" fill="none" stroke="#F4F4F0" stroke-width="6" stroke-linecap="round"/>
      <rect x="26" y="88" width="22" height="42" rx="8" fill="#111111"/><rect x="154" y="88" width="22" height="42" rx="8" fill="#111111"/>
      <path d="M37 130C36 172 58 180 82 174" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="88" cy="173" rx="11" ry="7" fill="#111111"/>
    </svg>
  </div>
  <div class="name">Kolpak</div>
  <div class="steps" id="steps"></div>
  <div class="now-line"><b>now</b><span id="now"></span><span class="cursor">_</span></div>
  <div class="pct" id="pct">0%</div>
</div>

<script>
(function () {
  var h = new URLSearchParams(location.search).get("h");
  if (h && /^\d+$/.test(h)) document.documentElement.style.setProperty("--h", h + "px");

  var last = "";
  function render(data) {
    if (!data || !Array.isArray(data.steps)) return;
    var key = JSON.stringify(data);
    if (key === last) return;
    last = key;

    var box = document.getElementById("steps");
    box.textContent = "";
    var score = 0;
    data.steps.forEach(function (s, n) {
      var el = document.createElement("div");
      var state = s.state === "done" || s.state === "now" ? s.state : "todo";
      el.className = "step " + state;
      var num = document.createElement("i"); num.textContent = n + 1;
      var name = document.createElement("span"); name.textContent = s.name || "";
      el.appendChild(num); el.appendChild(name);
      if (state === "done") score += 1;
      if (state === "now") {
        var part = Math.max(0, Math.min(1, Number(s.part) || 0));
        score += part;
        var fill = document.createElement("div");
        fill.className = "fill"; fill.style.width = (part * 100) + "%";
        el.appendChild(fill);
      }
      box.appendChild(el);
    });
    document.getElementById("now").textContent = data.now || "";
    document.getElementById("pct").textContent =
      Math.round(data.steps.length ? score / data.steps.length * 100 : 0) + "%";
  }

  // A <script> tag is used instead of fetch() so this works as a local file in OBS.
  function load() {
    var s = document.createElement("script");
    s.src = "progress.js?t=" + Date.now();
    s.onload = function () { render(window.KOLPAK_PROGRESS); s.remove(); };
    s.onerror = function () { s.remove(); };
    document.head.appendChild(s);
  }
  load();
  setInterval(load, 5000);
})();
</script>
</body>
</html>
