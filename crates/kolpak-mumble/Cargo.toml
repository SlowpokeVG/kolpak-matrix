[package]
name = "kolpak-mumble"
version = "0.1.0"
description = "Mumble client for Kolpak: control connection and server state. Voice comes later."
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.97"
publish = false

# Kept as its own crate so it builds and tests in seconds without the Tauri app,
# and so the app's merge surface with upstream stays at one dependency line.

[features]
default = ["audio"]
# Microphone capture and Opus encoding. Off for builds that only need the control channel.
audio = ["dep:cpal", "dep:ndk", "dep:nnnoiseless", "dep:unsafe-libopus"]

[dependencies]
# AES-128 for the UDP voice channel (OCB2).
aes = "0.8"
bytes = "1"
cpal = { version = "0.18", optional = true }
log = "0.4"
# RNNoise in pure Rust: noise suppression for the microphone.
nnnoiseless = { version = "0.5", default-features = false, optional = true }
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# libopus transpiled to Rust: no C compiler or cmake needed on any platform.
unsafe-libopus = { version = "0.2", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(target_os = "android")'.dependencies]
# AAudio directly on Android (src/android_audio.rs), for the voice-call input preset and
# usage cpal does not expose: that is what turns on the phone's echo cancellation. The same
# crate cpal uses; api-level-28 adds presets and usages, so the app's minSdk is 28.
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-28"], optional = true }

[target.'cfg(windows)'.dependencies]
# Key state for system-wide push to talk.
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
